name: Publish edge

# Every code push to main is published, but it is not a release: `edge` moves,
# `latest` does not. Making a push the release meant a README fix became a
# version number, and whatever was half-finished on main became the image most
# people pull.
on:
  workflow_dispatch:
  push:
    branches: [main]
    # None of these reach the image, and a multi-arch QEMU build is too
    # expensive to spend on a sentence.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'

concurrency:
  group: edge
  cancel-in-progress: true

jobs:
  edge:
    uses: ./.github/workflows/build-image.yml
    permissions:
      packages: write
    with:
      tag-spec: |
        type=raw,value=edge
        type=sha,prefix=sha-,format=short
