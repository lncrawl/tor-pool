name: Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  # Weekly, so a new Alpine tor release reaches the image without a code change.
  schedule:
    - cron: '0 2 * * 1'

env:
  IMAGE: ghcr.io/lncrawl/tor-pool

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          # The tag action needs history to work out the next version.
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # GHCR is the only registry, so GITHUB_TOKEN is the whole auth story —
      # no external secrets to rotate.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.tag.outputs.new_version }},enable=${{ steps.tag.outputs.new_version != '' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      # One buildx step covers everything: the Dockerfile is multi-stage, so it
      # builds the dashboard and the binary itself.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.tag.outputs.new_version || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
