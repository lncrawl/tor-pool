name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  web:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build only — publishing lives in docker-publish.yml. This exists so a
      # broken Dockerfile fails a PR instead of a release.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: tor-pool:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A pool that cannot boot is the failure mode a build alone would miss.
      # One instance is enough to prove tor starts, the control port
      # authenticates and bootstrap completes.
      - name: Boot a single-instance pool
        run: |
          docker run -d --name torpool-ci \
            -e POOL_SIZE=1 -e LOG_LEVEL=debug \
            -p 127.0.0.1:8080:8080 \
            tor-pool:ci

          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null; then
              echo "pool became healthy after ${i}0s"
              curl -s http://127.0.0.1:8080/api/instances
              exit 0
            fi
            sleep 10
          done

          echo "pool never became healthy"
          docker logs torpool-ci
          exit 1

      - name: Container logs
        if: always()
        run: docker logs torpool-ci || true

  # A `web` job (tsc + vite build) is added alongside the dashboard.
