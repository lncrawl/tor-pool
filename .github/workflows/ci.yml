name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  web:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      # `npm run build` writes over the committed placeholder, and the real
      # index.html references a hashed asset that is not tracked — so a binary
      # built from it serves a broken page to anyone who did not run npm.
      - name: The committed dashboard placeholder must survive a build
        working-directory: .
        run: |
          if ! git diff --quiet -- internal/server/dist/index.html; then
            echo "internal/server/dist/index.html was committed as build output."
            echo "Restore it: git checkout internal/server/dist/index.html"
            git diff -- internal/server/dist/index.html
            exit 1
          fi

  image:
    name: Image
    # Shared with the scheduled rebuild, which has to run exactly this check
    # before it publishes a tor nobody has tried yet.
    uses: ./.github/workflows/verify-image.yml
