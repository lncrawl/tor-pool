name: Verify image

# Build the image and prove a pool actually comes up in it.
#
# A build succeeding says nothing about whether tor starts, its control port
# authenticates, or bootstrap completes — and tor arrives from Alpine at build
# time, so a rebuild with no code change can break all three. That is the whole
# risk a scheduled rebuild carries, which is why it runs this before publishing.
on:
  workflow_call:
    inputs:
      ref:
        description: Ref to verify. Defaults to whatever started the calling workflow.
        required: false
        type: string
        default: ''

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Host architecture only, and loaded rather than pushed. A broken tor
      # package breaks both architectures identically — it is the same Alpine
      # package — so emulating arm64 here would double the time to learn nothing.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: tor-pool:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The point is to test the packages that will ship, not the ones that
          # were cached the last time someone touched the source.
          pull: true
          no-cache-filters: runtime

      - name: Report the tor version under test
        run: |
          docker run --rm --entrypoint tor tor-pool:ci --version | head -1 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # A pool that cannot boot is the failure mode a build alone would miss.
      # One instance is enough to prove tor starts, the control port
      # authenticates and bootstrap completes.
      - name: Boot a single-instance pool
        env:
          # Fixed rather than generated, so the assertions below can sign in.
          ADMIN_PASSWORD: ci-only-password
        run: |
          set -euo pipefail

          docker run -d --name torpool-ci \
            -e POOL_SIZE=1 -e LOG_LEVEL=debug \
            -e ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            -p 127.0.0.1:8080:8080 \
            tor-pool:ci

          # /health is public on purpose: the container healthcheck cannot send
          # a credential either.
          ready=false
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null; then
              echo "pool became healthy after ${i}0s"
              ready=true
              break
            fi
            sleep 10
          done
          if [ "$ready" != true ]; then
            echo "pool never became healthy"
            docker logs torpool-ci
            exit 1
          fi

          # The negative half, and the only end-to-end proof that authentication
          # is switched on at all. Note the -f: this step used to run `curl -s`
          # without it, so a 401 body printed and the step still passed.
          echo "== unauthenticated /api/instances must be refused =="
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/instances)
          if [ "$code" != "401" ]; then
            echo "expected 401, got $code — the API is open"
            exit 1
          fi

          echo "== sign in and read the pool =="
          # Responses are indented JSON, so the pattern has to tolerate the
          # whitespace around the colon — without it this silently extracts
          # nothing and the next call fails with a confusing 401.
          token=$(curl -sf -XPOST http://127.0.0.1:8080/api/auth/login \
            -H 'content-type: application/json' \
            -d "{\"user\":\"admin\",\"password\":\"$ADMIN_PASSWORD\"}" \
            | sed -n 's/.*"token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
          if [ -z "$token" ]; then
            echo "login returned no token"
            exit 1
          fi
          curl -sf -H "Authorization: Bearer $token" http://127.0.0.1:8080/api/instances

      - name: Container logs
        if: always()
        run: docker logs torpool-ci || true
