name: Verify image

on:
  workflow_call:
    inputs:
      ref:
        description: Ref to verify. Defaults to whatever started the calling workflow.
        required: false
        type: string
        default: ''

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          load: true
          tags: tor-pool:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          pull: true
          no-cache-filters: runtime

      - name: Report the tor version under test
        run: |
          docker run --rm --entrypoint tor tor-pool:ci --version | head -1 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Boot a single-instance pool
        env:
          ADMIN_PASSWORD: ci-only-password
        run: |
          set -euo pipefail

          docker run -d --name torpool-ci \
            -e POOL_SIZE=1 -e LOG_LEVEL=debug \
            -e ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            -p 127.0.0.1:8080:8080 \
            tor-pool:ci

          ready=false
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null; then
              echo "pool became healthy after ${i}0s"
              ready=true
              break
            fi
            sleep 10
          done
          if [ "$ready" != true ]; then
            echo "pool never became healthy"
            docker logs torpool-ci
            exit 1
          fi

          echo "== unauthenticated /api/instances must be refused =="
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/instances)
          if [ "$code" != "401" ]; then
            echo "expected 401, got $code — the API is open"
            exit 1
          fi

          echo "== the status endpoint must report that a credential is needed =="
          curl -sf http://127.0.0.1:8080/api/auth/status | grep -q '"required"[[:space:]]*:[[:space:]]*true' || {
            echo "/api/auth/status did not report required:true"
            exit 1
          }

          echo "== sign in and read the pool =="
          token=$(curl -sf -XPOST http://127.0.0.1:8080/api/auth/login \
            -H 'content-type: application/json' \
            -d "{\"user\":\"admin\",\"password\":\"$ADMIN_PASSWORD\"}" \
            | sed -n 's/.*"token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
          if [ -z "$token" ]; then
            echo "login returned no token"
            exit 1
          fi
          curl -sf -H "Authorization: Bearer $token" http://127.0.0.1:8080/api/instances
      - name: A pool with AUTH_DISABLED must answer without a credential
        run: |
          set -euo pipefail

          docker run -d --name torpool-open \
            -e POOL_SIZE=1 -e AUTH_DISABLED=true \
            -p 127.0.0.1:8081:8080 \
            tor-pool:ci

          up=false
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8081/api/auth/status >/dev/null 2>&1; then
              up=true
              break
            fi
            sleep 2
          done
          if [ "$up" != true ]; then
            echo "the API never answered"
            docker logs torpool-open
            exit 1
          fi

          curl -sf http://127.0.0.1:8081/api/auth/status | grep -q '"required"[[:space:]]*:[[:space:]]*false' || {
            echo "/api/auth/status did not report required:false"
            exit 1
          }

          echo "== /api/instances must be answered with no credential =="
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/api/instances)
          if [ "$code" != "200" ]; then
            echo "expected 200, got $code — AUTH_DISABLED did not reach the server"
            docker logs torpool-open
            exit 1
          fi
 
          printed=false
          for _ in $(seq 1 15); do
            if docker logs torpool-open >"$RUNNER_TEMP/open.log" 2>&1 &&
              grep -q 'AUTHENTICATION IS DISABLED' "$RUNNER_TEMP/open.log"; then
              printed=true
              break
            fi
            sleep 1
          done
          if [ "$printed" != true ]; then
            echo "the startup banner did not warn that authentication is off"
            docker logs torpool-open
            exit 1
          fi

      - name: Container logs
        if: always()
        run: |
          docker logs torpool-ci || true
          docker logs torpool-open || true
