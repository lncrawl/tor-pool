name: Build image

# How the image is built, in one place. What it is called is the caller's
# business: an edge build and a release build differ only in their tags and the
# version they stamp, and duplicating the buildx setup to express that is how the
# two drift apart.
on:
  workflow_call:
    inputs:
      tag-spec:
        description: docker/metadata-action tag specification, one rule per line.
        required: true
        type: string
      version:
        description: Stamped into main.version, which the API and dashboard report.
        required: true
        type: string

env:
  IMAGE: ghcr.io/lncrawl/tor-pool

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # GHCR is the only registry, so GITHUB_TOKEN is the whole auth story —
      # no external secrets to rotate.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ inputs.tag-spec }}
          # Every tag this repo publishes is decided by the caller, including
          # `latest`. Left on auto, metadata-action would add it to any build
          # that happens to run on the default branch.
          flavor: latest=false

      # One buildx step covers everything: the Dockerfile is multi-stage, so it
      # builds the dashboard and the binary itself.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Reports itself as \`${{ inputs.version }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
