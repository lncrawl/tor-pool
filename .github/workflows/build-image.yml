name: Build image

# How the image is built, in one place. What it is called is the caller's
# business: an edge build and a release build differ only in their tags and the
# version they stamp, and duplicating the buildx setup to express that is how the
# two drift apart.
on:
  workflow_call:
    inputs:
      tag-spec:
        description: docker/metadata-action tag specification, one rule per line.
        required: true
        type: string
      version:
        description: >
          Stamped into main.version, which the API and dashboard report. Omit for a
          non-release build and it becomes edge-<short sha>.
        required: false
        type: string
        default: ''
      ref:
        description: Ref to build. Defaults to whatever started the calling workflow.
        required: false
        type: string
        default: ''
      refresh-packages:
        description: >
          Re-resolve the runtime stage's OS packages instead of reusing the cached
          layer. What the scheduled rebuild exists for.
        required: false
        type: boolean
        default: false

env:
  IMAGE: ghcr.io/lncrawl/tor-pool

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          # Empty means the default, which is the ref that started the caller.
          ref: ${{ inputs.ref }}

      # Deliberately not a bare version number when none was given: anyone
      # reading this off /api/pool or the dashboard header should be able to tell
      # at a glance that they are not running a release.
      - name: Resolve the version stamp
        id: stamp
        env:
          GIVEN: ${{ inputs.version }}
        run: |
          set -eu
          echo "version=${GIVEN:-edge-$(git rev-parse --short HEAD)}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # GHCR is the only registry, so GITHUB_TOKEN is the whole auth story —
      # no external secrets to rotate.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ inputs.tag-spec }}
          # Every tag this repo publishes is decided by the caller, including
          # `latest`. Left on auto, metadata-action would add it to any build
          # that happens to run on the default branch.
          flavor: latest=false

      # One buildx step covers everything: the Dockerfile is multi-stage, so it
      # builds the dashboard and the binary itself.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.stamp.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The runtime stage installs tor from Alpine at build time, and its
          # layer is a cache hit on the instruction alone — so picking up a new
          # tor means invalidating that one stage, and re-pulling the base image
          # it sits on. The expensive node and go stages stay cached.
          pull: ${{ inputs.refresh-packages }}
          no-cache-filters: ${{ inputs.refresh-packages && 'runtime' || '' }}

      - name: Summarise
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Reports itself as \`${{ steps.stamp.outputs.version }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
