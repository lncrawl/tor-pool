name: CodeQL

# torpool terminates untrusted connections and parses attacker-influenced
# protocol bytes (SOCKS5 handshakes, proxy headers), so static analysis is
# cheap insurance rather than box-ticking.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [go]

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: ${{ matrix.language }}
          build-mode: autobuild

      - name: Analyze
        uses: github/codeql-action/analyze@v4.37.4
        with:
          category: /language:${{ matrix.language }}
