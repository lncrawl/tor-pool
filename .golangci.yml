version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - revive
    - unconvert
    - usestdlibvars
    - wastedassign

  settings:
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers]
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        # Fires on the small helper wrappers around env parsing.
        - ifElseChain
      settings:
        hugeParam:
          # Setup structs (InstanceConfig, FleetOptions) are copied once per
          # instance at construction, never per request, so the default 80-byte
          # warning only produces noise here. Anything genuinely large enough to
          # matter — the top-level Config — still trips this.
          sizeThreshold: 256

  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - errcheck
          - gocritic
          - revive

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/lncrawl/tor-pool
