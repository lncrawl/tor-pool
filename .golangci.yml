version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - revive
    - unconvert
    - usestdlibvars
    - wastedassign

  settings:
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers]
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        # Fires on the small helper wrappers around env parsing.
        - ifElseChain

  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - errcheck
          - gocritic
          - revive

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/lncrawl/tor-pool
