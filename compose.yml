services:
  tor-pool:
    # Published image, or build locally with: docker compose up -d --build
    image: ghcr.io/lncrawl/tor-pool:latest
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: tor-pool
    restart: unless-stopped

    environment:
      # The dashboard login, admin / admin unless you set one — convenient for a
      # pool on your own machine, which is what this file publishes by default.
      #
      # Change it before you widen API_PUBLISH below. Set it to nothing at all
      # (ADMIN_PASSWORD=) and the first boot generates one instead and prints it
      # once to this container's log, which is the safe default for a host that
      # is reachable from anywhere. A password set here is never written to disk.
      ADMIN_USER: '${ADMIN_USER:-admin}'
      ADMIN_PASSWORD: '${ADMIN_PASSWORD:-admin}'

      # A fixed proxy credential, for provisioning from files instead of the
      # dashboard. Must start with tp_. Empty means the first boot issues one and
      # prints it.
      PROXY_TOKEN: '${PROXY_TOKEN:-}'

      # How many tor instances to run. Each one is an independent exit identity.
      POOL_SIZE: '${POOL_SIZE:-5}'

      # Serve traffic as soon as this many instances have bootstrapped, instead
      # of waiting for the whole pool.
      MIN_READY: '${MIN_READY:-1}'

      # How a caller with no SOCKS credentials is identified: ip | random | shared
      DEFAULT_SESSION: '${DEFAULT_SESSION:-ip}'

      # Idle sessions are unpinned after this long.
      SESSION_TTL: '${SESSION_TTL:-10m}'

      # Move an instance's sessions elsewhere when it is rotated.
      DRAIN_ON_ROTATE: '${DRAIN_ON_ROTATE:-true}'

      # Lock each instance to one exit relay, so its exit IP holds still until it
      # is rotated. Off by default: the instance then depends on that one relay.
      PIN_EXIT_RELAY: '${PIN_EXIT_RELAY:-false}'

      LOG_LEVEL: '${LOG_LEVEL:-info}'

    ports:
      # SOCKS5 proxy — the sticky endpoint your scraper connects to. The username
      # is the session key and the password is a token:
      #   socks5h://my-session:tp_xxxxxxxxxxxxxxxxxxxxxx@127.0.0.1:9250
      - '${SOCKS_PUBLISH:-127.0.0.1:9250}:9250'

      # HTTP/HTTPS CONNECT proxy, for tools without SOCKS support.
      - '${HTTP_PUBLISH:-127.0.0.1:9251}:9251'

      # Dashboard and REST API. Still bound to loopback even though it now
      # requires a credential: there is no TLS here, so the password and every
      # token cross the wire in cleartext. Widen this only behind something that
      # terminates TLS.
      - '${API_PUBLISH:-127.0.0.1:8080}:8080'

    # Persist tor state so restarts re-bootstrap from a cached consensus instead
    # of from scratch. It also holds the credential store, which is what makes a
    # generated password and its tokens survive `down` and `up` — `down -v`
    # destroys them and the next boot generates new ones.
    volumes:
      - tor_data:/var/lib/tor

    healthcheck:
      # Reports unhealthy while no instance can carry traffic.
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 5s
      # Generous: a cold pool has to bootstrap over Tor before it is usable.
      start_period: 120s
      retries: 3

volumes:
  tor_data:
